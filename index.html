<!DOCTYPE html>
<html lang="en" data-accent="chalk" data-tint="off" data-size="l">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Benchmark</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Benchmark">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Benchmark: black, white and red, set in a typeface built for legibility.
     Layout: one-screen app. Header, scrolling view and a bottom tab bar; a workout opens as a full-screen sheet. */
  --bg: #F4F4F4;
  --surface: #FFFFFF;
  --surface-2: #EAEAEA;
  --line: #D4D4D4;
  --ink: #0B0B0B;
  --muted: #4F4F4F;
  --good: #0B0B0B;
  --good-ink: #FFFFFF;
  --warn: var(--accent);
  --bad: #C8102E;
  --accent: var(--acc-l);
  --accent-ink: var(--acc-ink-l);
  --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --good-soft: color-mix(in srgb, var(--ink) 8%, transparent);
  --shadow: 0 1px 2px rgb(20 20 25 / .06);
  --font-display: "Atkinson Hyperlegible", Verdana, "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", Verdana, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #121212; --surface-2: #232323; --line: #333333;
    --ink: #FFFFFF; --muted: #BDBDBD; --good: #FFFFFF; --good-ink: #000000; --warn: var(--accent); --bad: #FF5A5A;
    --accent: var(--acc-d); --accent-ink: var(--acc-ink-d); --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #121212; --surface-2: #232323; --line: #333333;
  --ink: #FFFFFF; --muted: #BDBDBD; --good: #FFFFFF; --good-ink: #000000; --warn: var(--accent); --bad: #FF5A5A;
  --accent: var(--acc-d); --accent-ink: var(--acc-ink-d); --shadow: none;
  color-scheme: dark;
}
/* The user's own theme choice wins over the host's */
html:root.force-light {
  --bg: #F4F4F4; --surface: #FFFFFF; --surface-2: #EAEAEA; --line: #D4D4D4;
  --ink: #0B0B0B; --muted: #4F4F4F; --good: #0B0B0B; --good-ink: #FFFFFF; --warn: var(--accent); --bad: #C8102E;
  --accent: var(--acc-l); --accent-ink: var(--acc-ink-l); --shadow: 0 1px 2px rgb(20 20 25 / .06);
  color-scheme: light;
}
html:root.force-dark {
  --bg: #000000; --surface: #121212; --surface-2: #232323; --line: #333333;
  --ink: #FFFFFF; --muted: #BDBDBD; --good: #FFFFFF; --good-ink: #000000; --warn: var(--accent); --bad: #FF5A5A;
  --accent: var(--acc-d); --accent-ink: var(--acc-ink-d); --shadow: none;
  color-scheme: dark;
}
html[data-accent="blue"]   { --acc-l: #1E5BD0; --acc-d: #5D9BFF; --acc-ink-l: #FFFFFF; --acc-ink-d: #0A1426; }
html[data-accent="red"]    { --acc-l: #C8101A; --acc-d: #E3141E; --acc-ink-l: #FFFFFF; --acc-ink-d: #FFFFFF; }
html[data-accent="yellow"] { --acc-l: #8A6500; --acc-d: #F2C230; --acc-ink-l: #FFFFFF; --acc-ink-d: #221A00; }
html[data-accent="green"]  { --acc-l: #157444; --acc-d: #45CF86; --acc-ink-l: #FFFFFF; --acc-ink-d: #06200F; }
/* macro colors: one hue per nutrient so the rings read at a glance (validated for color-blind separation in ring order) */
html { --m-cal: light-dark(#2A78D6, #3987E5); --m-p: light-dark(#EB6834, #D95926); --m-c: light-dark(#1BAF7A, #199E70); --m-f: light-dark(#EDA100, #C98500); }
html:root .rings .ring { stroke-opacity: 1; }
html:root .rl i { opacity: 1 !important; }
/* black and white: simple color by section (workout blue, food orange, weight green, goals violet) */
html[data-accent="chalk"] { --c-work: light-dark(#2A78D6, #3987E5); --c-food: light-dark(#EB6834, #D95926); --c-weight: light-dark(#1BAF7A, #199E70); --c-goal: light-dark(#6250D6, #9085E9); --c-water: light-dark(#2A78D6, #3987E5); }
html[data-accent="chalk"] :is(#view[data-tab="workout"], .dc-work) { --accent: var(--c-work); }
html[data-accent="chalk"] :is(#view[data-tab="food"], .dc-food) { --accent: var(--c-food); }
html[data-accent="chalk"] :is(#view[data-tab="weight"], .dc-weight) { --accent: var(--c-weight); }
html[data-accent="chalk"] .dc-goal { --accent: var(--c-goal); }
html[data-accent="chalk"] .dc-water { --accent: var(--c-water); }
html[data-accent="chalk"] :is(#view[data-tab="workout"], #view[data-tab="food"], #view[data-tab="weight"], .dc-work, .dc-food, .dc-weight, .dc-goal, .dc-water) {
  --accent-ink: #FFFFFF; --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent);
  --accent-grad: linear-gradient(135deg, color-mix(in srgb, var(--accent) 72%, #fff) 0%, var(--accent) 48%, color-mix(in srgb, var(--accent) 70%, #000) 100%);
  --glow: color-mix(in srgb, var(--accent) 55%, transparent);
}
html[data-accent="chalk"] .tab[aria-current="page"][data-tab="workout"] { color: var(--c-work); }
html[data-accent="chalk"] .tab[aria-current="page"][data-tab="food"] { color: var(--c-food); }
html[data-accent="chalk"] .tab[aria-current="page"][data-tab="weight"] { color: var(--c-weight); }
html[data-accent="chalk"]  { --acc-l: #111111; --acc-d: #F2F2F2; --acc-ink-l: #FFFFFF; --acc-ink-d: #000000; }
html[data-size="l"] { font-size: 18px; }

* { box-sizing: border-box; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.45; overflow: hidden; -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.ic { width: 1.25rem; height: 1.25rem; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }

/* ---------- App frame ---------- */
#app { display: flex; flex-direction: column; height: 100%; }
.topbar { flex: none; padding: calc(env(safe-area-inset-top) + 14px) 16px 10px; }
.topbar-in { max-width: 640px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.topbar h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.875rem; line-height: 1.1; }
.topbar .sub { color: var(--muted); font-size: .875rem; margin-top: 4px; }
#view { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 28px; }
.inner { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.tabs { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 4px 4px calc(env(safe-area-inset-bottom) + 4px); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 0 5px; color: var(--muted); font-size: .75rem; font-weight: 700; border-radius: 10px; text-align: center; }
.tab .ic { width: 1.375rem; height: 1.375rem; }
.tab[aria-current="page"] { color: var(--accent); }
.minibar { flex: none; margin: 0 10px 8px; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-align: left; box-shadow: 0 4px 14px rgb(0 0 0 / .18); }
.minibar .mb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.minibar .num { font-size: 1.125rem; }
.mb-rest { padding: 2px 8px; border-radius: 999px; background: rgb(255 255 255 / .2); font-size: .8125rem; }
.minibar-wrap { max-width: 660px; width: 100%; margin: 0 auto; }

/* ---------- Building blocks ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 10px; }
.sec { font-family: var(--font-display); font-weight: 700; font-size: 1.1875rem; color: var(--ink); }
.h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.625rem; line-height: 1.1; }
.h3 { font-weight: 700; font-size: 1.0625rem; line-height: 1.25; }
.eyebrow { font-size: .875rem; font-weight: 700; color: var(--accent); }
.link { color: var(--accent); font-weight: 600; font-size: .9375rem; padding: 6px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: .9375rem; white-space: nowrap; text-align: center; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: .8125rem; border-radius: 10px; }
.btn.lg { min-height: 54px; font-size: 1.0625rem; }
.btn.block { width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.danger-text { color: var(--bad); }
.btn.danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; color: var(--ink); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 0 11px; border-radius: 999px; background: var(--surface-2); font-size: .8125rem; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-ink); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip .ic { width: 1rem; height: 1rem; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.pr { display: inline-flex; align-items: center; gap: 4px; color: var(--warn); font-weight: 700; }
.pr .ic { width: 1rem; height: 1rem; }
.banner { display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); font-size: .875rem; }
.txt { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 1rem; }
textarea.txt { resize: vertical; min-height: 44px; }
.txt:focus { outline: none; border-color: var(--accent); }
select.txt { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.lbl { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, .7fr); gap: 8px; }
.grid2 > *, .grid3 > * { min-width: 0; }
.grid3 .txt { padding-left: 8px; padding-right: 6px; min-width: 0; }
.empty { color: var(--muted); font-size: .9375rem; }

/* ---------- Home ---------- */
.resume { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; width: 100%; border-color: var(--accent); }
.start { display: flex; flex-direction: column; gap: 10px; }
.week-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.week-top .big { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1; }
.week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .8125rem; color: var(--muted); font-weight: 600; }
.wd b { display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: 50%; background: var(--surface-2); color: var(--ink); font-family: var(--font-display); font-size: 1rem; }
.wd.on b { background: var(--accent); color: var(--accent-ink); }
.wd.today b { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.goalbar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 12px; overflow: hidden; }
.goalbar i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
.routine { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.r-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.r-actions { display: flex; align-items: center; gap: 2px; flex: none; }
.mini-hist { display: flex; justify-content: space-between; gap: 10px; text-align: left; width: 100%; align-items: center; }

/* ---------- History ---------- */
.cal-head { display: flex; align-items: center; justify-content: space-between; }
.cal-head .h3 { font-family: var(--font-display); font-size: 1.25rem; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; text-align: center; }
.cal .dow { font-size: .8125rem; font-weight: 700; color: var(--muted); padding: 4px 0; }
.cal .day { aspect-ratio: 1; max-height: 44px; display: grid; place-items: center; border-radius: 50%; font-family: var(--font-display); font-weight: 600; font-size: .9375rem; margin: 0 auto; width: 100%; max-width: 44px; }
.cal .day.has { background: var(--accent); color: var(--accent-ink); }
.cal .day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal .day.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.cal .day.out { visibility: hidden; }
.hist { display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; }
.hc-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.hc-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .875rem; color: var(--muted); align-items: center; }
.hc-stats span { display: inline-flex; align-items: center; gap: 5px; }
.hc-stats .ic { width: 1rem; height: 1rem; }
.hc-lines { display: flex; flex-direction: column; gap: 3px; font-size: .875rem; border-top: 1px solid var(--line); padding-top: 8px; }
.hl { display: flex; justify-content: space-between; gap: 12px; }
.hl span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hl span:last-child { flex: none; font-family: var(--font-display); font-size: .9375rem; }
.month-label { font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem; color: var(--ink); margin-top: 8px; }

/* ---------- Progress ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .v { font-family: var(--font-display); font-weight: 700; font-size: 1.75rem; line-height: 1.1; }
.tile .v small { font-size: 1rem; color: var(--muted); font-weight: 600; }
.tile .l { color: var(--muted); font-size: .875rem; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.mbars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 8px 10px; align-items: center; font-size: .875rem; }
.mbars .track { height: 10px; display: flex; gap: 2px; }
.mbars .fillbar.sec { opacity: .38; border-radius: 0 4px 4px 0; animation-delay: .12s; }
.mbars .fillbar:has(+ .fillbar.sec) { border-radius: 0; }
.mb-key { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
.mb-key span { display: inline-flex; align-items: center; gap: 6px; }
.mb-key i { width: 14px; height: 8px; border-radius: 2px; background: var(--accent); display: inline-block; }
.mb-key i.sec { opacity: .38; }
.mbars .fillbar { height: 10px; border-radius: 0 4px 4px 0; background: var(--accent); min-width: 2px; }
.mbars .val { font-family: var(--font-display); font-weight: 600; color: var(--muted); }
.exrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); text-align: left; width: 100%; }
.exrow:first-child { border-top: 0; }
.exrow .r { text-align: right; flex: none; }
.chart { position: relative; width: 100%; min-height: 60px; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.chart text { font-family: var(--font-body); font-size: 12px; fill: var(--muted); }
.chart .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 8px; font-size: .75rem; line-height: 1.3; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); }
.chart .tip b { font-family: var(--font-display); font-size: .9375rem; }
.chart-empty { display: grid; place-items: center; min-height: 120px; color: var(--muted); font-size: .875rem; text-align: center; padding: 0 20px; border: 1px dashed var(--line); border-radius: 10px; }
.records { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.rec { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.rec .v { font-family: var(--font-display); font-weight: 700; font-size: 1.375rem; line-height: 1.1; }
.rec .l { font-size: .8125rem; color: var(--muted); }

/* ---------- Settings ---------- */
.list { padding: 0 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 10px 0; border-top: 1px solid var(--line); }
.list > .row:first-child { border-top: 0; }
.row-l { min-width: 0; font-weight: 500; }
.row-l .small { font-weight: 400; }
button.row { width: 100%; text-align: left; }
.row .ic.chev { color: var(--muted); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; flex: none; }
.seg button { min-width: 44px; min-height: 34px; padding: 0 10px; border-radius: 8px; font-weight: 600; font-size: .875rem; color: var(--muted); }
.seg.wide { display: flex; width: 100%; }
.seg.wide button { flex: 1; min-height: 40px; font-size: .9375rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .15); }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--surface-2); position: relative; flex: none; transition: background .15s; border: 1px solid var(--line); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .3); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.row select.txt { width: auto; min-width: 96px; min-height: 38px; padding-top: 6px; padding-bottom: 6px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.plates-pick { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 12px; }
.sync { display: flex; gap: 10px; align-items: center; font-size: .875rem; }
.sync .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.sync .dot.ok { background: var(--good); }
.sync .dot.warn { background: var(--warn); }
.foot { padding: 6px 2px 0; }

/* ---------- Sheets ---------- */
.sheet { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); z-index: 30; }
.sheet.open { transform: none; }
.sheet-head { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top) + 6px) 10px 6px; }
.sheet-head-in { max-width: 660px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 48px; }
.sh-left { justify-self: start; display: flex; gap: 2px; align-items: center; }
.sh-right { justify-self: end; display: flex; gap: 6px; align-items: center; }
.sh-title { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; text-align: center; white-space: nowrap; }
.sh-title.timer { font-size: 1.5rem; }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 40px; }
.sheet-foot { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); }
.sheet-foot:empty { display: none; }
.sheet-foot > div { max-width: 640px; margin: 0 auto; }

/* ---------- Workout editor ---------- */
.meta { display: flex; flex-direction: column; gap: 8px; }
.title-input { font-family: var(--font-display); font-weight: 700; font-size: 1.625rem; border: 0; background: transparent; padding: 2px 0; min-height: 0; border-radius: 0; border-bottom: 1px solid transparent; }
.title-input:focus { border-bottom-color: var(--accent); }
.cards { display: flex; flex-direction: column; gap: 12px; }
.excard { padding: 12px 10px 10px; }
.ex-head { display: flex; align-items: center; gap: 4px; justify-content: space-between; padding-left: 4px; }
.exname { font-weight: 700; font-size: 1.0625rem; color: var(--accent); text-align: left; padding: 6px 0; line-height: 1.25; }
.ex-meta { display: flex; align-items: center; gap: 8px; padding: 0 4px; flex-wrap: wrap; }
.exnote { margin-top: 8px; font-size: .9375rem; min-height: 40px; }
.sets { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
.sethead, .setrow { display: grid; grid-template-columns: var(--cols); gap: 6px; align-items: center; }
.sethead { font-size: .8125rem; font-weight: 700; color: var(--muted); padding: 0 2px 2px; }
.sethead > * { text-align: center; }
.setrow { border-radius: 10px; padding: 3px 2px; transition: background .15s; }
.setrow.done { background: var(--good-soft); }
.setno { height: 40px; border-radius: 8px; background: var(--surface-2); font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem; text-align: center; }
.setno.t-w { color: var(--muted); }
.setno.t-d { color: var(--ink); }
.setno.t-f { color: var(--bad); }
.setrow.done .setno { background: transparent; }
.prev { height: 40px; color: var(--muted); font-family: var(--font-display); font-size: .875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; border-radius: 8px; padding: 0 2px; }
.prev:disabled { opacity: .7; }
.cell { height: 42px; width: 100%; min-width: 0; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem; padding: 0 4px; }
.cell::placeholder { color: var(--muted); opacity: .8; font-weight: 500; }
.cell:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.setrow.done .cell { background: transparent; }
.check { height: 40px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.check.on { background: var(--good); color: var(--good-ink); }
.check .ic { stroke-width: 2.6; }
.addset { margin-top: 6px; }
.empty-ex { padding: 22px 6px; text-align: center; }
.restbar { display: flex; flex-direction: column; gap: 8px; }
.rb-track { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.rb-fill { height: 100%; background: var(--accent); transform-origin: left; }
.rb-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; }
.rb-time { text-align: center; line-height: 1.05; }
.rb-time b { display: block; font-family: var(--font-display); font-size: 1.75rem; }
.rb-time span { font-size: .8125rem; color: var(--muted); font-weight: 700; }
.wk-tools { display: flex; gap: 8px; }

/* ---------- Picker ---------- */
.pick-top { position: sticky; top: -14px; background: var(--bg); padding: 0 0 8px; margin-top: -2px; z-index: 2; display: flex; flex-direction: column; gap: 8px; }
.search { position: relative; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .txt { padding-left: 40px; }
.pick-list { display: flex; flex-direction: column; }
.pick-item { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.pick-item .pi-main { flex: 1; min-width: 0; }
.pick-item .pi-name { font-weight: 600; }
.pick-mark { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: transparent; }
.pick-item[aria-pressed="true"] .pick-mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pick-item .ic { width: 1rem; height: 1rem; stroke-width: 3; }
.pick-group { font-family: var(--font-display); font-weight: 700; font-size: 1rem; color: var(--ink); padding: 16px 4px 4px; }
.foot-row { display: flex; gap: 10px; }
.foot-row .btn { flex: 1; }

/* ---------- Dialogs ---------- */
.dlg-bd { position: fixed; inset: 0; z-index: 100; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .18s; }
.dlg-bd.open { opacity: 1; }
.dlg { width: 100%; max-width: 520px; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 16px); display: flex; flex-direction: column; gap: 12px; transform: translateY(24px); transition: transform .2s; }
.dlg-bd.open .dlg { transform: none; }
@media (min-width: 600px) { .dlg-bd { align-items: center; } .dlg { border-radius: 18px; } }
.dlg-title { font-family: var(--font-display); font-weight: 700; font-size: 1.375rem; line-height: 1.15; }
.opt-list { display: flex; flex-direction: column; gap: 2px; }
.opt { min-height: 48px; text-align: left; padding: 10px 12px; border-radius: 10px; font-weight: 600; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.opt:hover { background: var(--surface-2); }
.opt.danger { color: var(--bad); }
.opt.sel { color: var(--accent); }
.opt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.opt-grid .opt { background: var(--surface-2); text-align: center; align-items: center; font-family: var(--font-display); font-size: 1.125rem; }
.opt-grid .opt.sel { background: var(--accent); color: var(--accent-ink); }
.type-list { display: flex; flex-direction: column; gap: 6px; }
.type-opt { display: flex; flex-direction: column; gap: 1px; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.type-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.type-opt b { font-weight: 600; }
.plate-svg { width: 100%; height: auto; display: block; }
.ld-total { text-align: center; font-size: 2.3rem; font-weight: 800; line-height: 1.1; margin: 6px 0 4px; }
.ld-total .muted.small { font-size: .85rem; font-weight: 400; margin-top: 2px; }
.ld-bar { border-radius: 14px; padding: 4px; transition: background .15s, box-shadow .15s; }
.ld-bar.hot { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.ld-svg { width: 100%; height: auto; display: block; }
.ld-on { cursor: pointer; }
.ld-on.pop { animation: ldpop .24s var(--ease); }
@keyframes ldpop { from { transform: translateX(46px); opacity: 0; } }
.ld-tray { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin-top: 8px; min-height: 76px; }
.ld-plate { display: grid; place-items: center; padding: 0; width: 40px; height: var(--ph); border-radius: 8px; background: var(--pc); font-weight: 800; font-size: .85rem; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .22), 0 2px 6px rgb(0 0 0 / .22); touch-action: none; user-select: none; -webkit-user-select: none; transition: opacity .12s; }
.ld-plate.lifting { opacity: .35; }
.ld-ghost { position: fixed; left: 0; top: 0; z-index: 9999; pointer-events: none; box-shadow: 0 12px 26px rgb(0 0 0 / .35); }
.ld-panel { margin: 8px 0 10px; padding: 10px 10px 8px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.ld-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ld-panel .ld-total { font-size: 1.7rem; margin: 0; text-align: right; }
.ld-panel select.txt { width: auto; min-height: 36px; padding: 6px 30px 6px 10px; font-size: .9rem; }
.ld-panel .ld-bar { margin-top: 6px; }
.ld-panel .ld-tray { min-height: 60px; margin-top: 4px; gap: 6px; }
.ld-panel .ld-plate { width: 36px; font-size: .8rem; }
.ld-opts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.ld-opt { display: flex; align-items: center; gap: 6px; }
.ld-opts .link { margin-left: auto; }
.ld-hint { margin-top: 6px; }
.icon-btn.ld-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.ld-svg { touch-action: none; }
.ld-bar.off { background: color-mix(in srgb, var(--bad) 12%, transparent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--bad) 60%, transparent); }
html:not([data-accent="chalk"]) .seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 26%, var(--seg-on)); }
html:not([data-accent="chalk"]) .tab[aria-current="page"] { color: var(--accent); }
html:not([data-accent="chalk"]) .tab-ind { background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); }
/* every set done: the exercise card fills with a soft tint */
.card.excard { transition: background .35s var(--ease), border-color .35s var(--ease); }
.card.excard.complete { --fillc: var(--c-work, var(--accent)); background: linear-gradient(color-mix(in srgb, var(--fillc) 13%, transparent), color-mix(in srgb, var(--fillc) 13%, transparent)), linear-gradient(180deg, var(--glass-hi), var(--glass)); border-color: color-mix(in srgb, var(--fillc) 38%, transparent); }
.plate-out { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.pct { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; font-size: .9375rem; }
.pct div { padding: 7px 4px; border-top: 1px solid var(--line); }
.pct .hd { font-size: .8125rem; font-weight: 700; color: var(--muted); border-top: 0; }
.copybox { width: 100%; min-height: 160px; font-family: ui-monospace, Menlo, monospace; font-size: .75rem; }
.sum-hero { display: flex; flex-direction: column; gap: 4px; padding: 6px 0 4px; }
.prlist { display: flex; flex-direction: column; gap: 8px; }
.pritem { display: flex; gap: 10px; align-items: flex-start; }
.pritem .ic { color: var(--warn); margin-top: 2px; }
.wd-ex { display: flex; flex-direction: column; gap: 4px; }
.wd-set { display: grid; grid-template-columns: 2rem 1fr auto; gap: 8px; font-size: .9375rem; align-items: baseline; }
.wd-set .n { font-family: var(--font-display); font-weight: 700; color: var(--muted); text-align: center; }
.wd-set .v { font-family: var(--font-display); font-size: 1.0625rem; font-weight: 600; }
.wd-set .e { font-size: .8125rem; color: var(--muted); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 140px; }

/* ---------- Live scanner ---------- */
.scanner { position: fixed; inset: 0; z-index: 150; background: #000; color: #fff; opacity: 0; transition: opacity .25s; }
.scanner.open { opacity: 1; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: absolute; left: 9%; right: 9%; top: 34%; height: 20%; border-radius: 22px; border: 2px solid rgb(255 255 255 / .9); box-shadow: 0 0 0 100vmax rgb(0 0 0 / .55); }
.scan-line { position: absolute; left: 6%; right: 6%; top: 50%; height: 2px; background: linear-gradient(90deg, transparent, var(--acc-d), transparent); box-shadow: 0 0 14px var(--acc-d); animation: scanline 1.5s ease-in-out infinite alternate; }
@keyframes scanline { from { transform: translateY(-260%); } to { transform: translateY(260%); } }
.scan-top { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; }
.scan-title { font-weight: 700; font-size: 1.125rem; }
.scan-round { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: rgb(255 255 255 / .16); border: 1px solid rgb(255 255 255 / .25); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.scan-round.on { background: #fff; color: #000; }
.scan-round[hidden] { display: grid !important; visibility: hidden; }
.scan-bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 16px calc(env(safe-area-inset-bottom) + 28px); }
.scan-hint { font-weight: 700; text-align: center; text-shadow: 0 1px 6px rgb(0 0 0 / .6); }
.scan-pill { min-height: 46px; padding: 0 20px; border-radius: 999px; font-weight: 700; color: #fff; background: rgb(255 255 255 / .16); border: 1px solid rgb(255 255 255 / .25); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }

/* ---------- Food ---------- */
.scan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.busy { display: flex; gap: 14px; align-items: center; padding: 6px 0; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.daynav { display: flex; align-items: center; justify-content: space-between; padding: 8px; }
.cal-sum { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cal-sum .big { font-family: var(--font-display); font-weight: 700; font-size: 2.25rem; line-height: 1; }
.nut-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; margin: 16px 0 8px; }
.nut-top { display: flex; justify-content: space-between; gap: 4px 8px; font-size: .9375rem; flex-wrap: wrap; }
.goalbar.thin { height: 5px; margin-top: 6px; }
.goals .goal-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); }
.goals .goal-item:last-child { border-bottom: 0; }
.gi-ring { flex: none; }
.gi-ring text { font-size: 10.5px; font-weight: 700; fill: var(--ink); }
.gi-main { flex: 1; min-width: 0; }
.gi-title { font-weight: 700; overflow-wrap: anywhere; }
.food-home { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.nut-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; }
.check-row input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.goal-row { display: grid; grid-template-columns: 1fr 6.5rem; gap: 10px; align-items: center; min-height: 52px; border-top: 1px solid var(--line); }
.food-total { font-weight: 700; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }

#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translate(-50%, -20px); opacity: 0; z-index: 200; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9375rem; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }


/* ================= Premium layer: glass, gradient light, motion ================= */
:root {
  --bg: #F3F3F3; --surface: #FFFFFF; --surface-2: rgb(20 0 0 / .055); --line: rgb(20 0 0 / .09);
  --glass: rgb(255 255 255 / .58); --glass-hi: rgb(255 255 255 / .82); --glass-2: rgb(255 255 255 / .74); --glass-line: rgb(255 255 255 / .95); --glass-edge: rgb(255 255 255 / .9);
  --seg-on: #FFFFFF; --bar: #F3F3F3; --amb1: rgb(0 0 0 / .07); --amb2: rgb(0 0 0 / .05); --amb3: rgb(0 0 0 / .04);
  --shadow: 0 10px 30px -12px rgb(60 0 0 / .18), 0 1px 2px rgb(0 0 0 / .05);
  --accent-grad: linear-gradient(135deg, color-mix(in srgb, var(--accent) 72%, #fff) 0%, var(--accent) 48%, color-mix(in srgb, var(--accent) 70%, #000) 100%);
  --glow: color-mix(in srgb, var(--accent) 55%, transparent);
  --ambient: radial-gradient(42% 34% at 12% 8%, var(--amb1), transparent 72%), radial-gradient(48% 38% at 95% 32%, var(--amb2), transparent 72%), radial-gradient(55% 42% at 30% 105%, var(--amb3), transparent 72%);
  --spring: cubic-bezier(.22, 1.2, .36, 1);
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #050505; --surface: #141414; --surface-2: rgb(255 255 255 / .075); --line: rgb(255 255 255 / .1);
  --glass: rgb(255 255 255 / .045); --glass-hi: rgb(255 255 255 / .085); --glass-2: rgb(24 22 22 / .72); --glass-line: rgb(255 255 255 / .12); --glass-edge: rgb(255 255 255 / .1);
  --seg-on: rgb(255 255 255 / .16); --bar: #050505; --amb1: rgb(255 255 255 / .09); --amb2: rgb(255 255 255 / .06); --amb3: rgb(255 255 255 / .05);
  --shadow: 0 14px 34px -14px rgb(0 0 0 / .8); } }
:root[data-theme="dark"] { --bg: #050505; --surface: #141414; --surface-2: rgb(255 255 255 / .075); --line: rgb(255 255 255 / .1);
  --glass: rgb(255 255 255 / .045); --glass-hi: rgb(255 255 255 / .085); --glass-2: rgb(24 22 22 / .72); --glass-line: rgb(255 255 255 / .12); --glass-edge: rgb(255 255 255 / .1);
  --seg-on: rgb(255 255 255 / .16); --bar: #050505; --amb1: rgb(255 255 255 / .09); --amb2: rgb(255 255 255 / .06); --amb3: rgb(255 255 255 / .05);
  --shadow: 0 14px 34px -14px rgb(0 0 0 / .8); }
html:root.force-dark { --bg: #050505; --surface: #141414; --surface-2: rgb(255 255 255 / .075); --line: rgb(255 255 255 / .1);
  --glass: rgb(255 255 255 / .045); --glass-hi: rgb(255 255 255 / .085); --glass-2: rgb(24 22 22 / .72); --glass-line: rgb(255 255 255 / .12); --glass-edge: rgb(255 255 255 / .1);
  --seg-on: rgb(255 255 255 / .16); --bar: #050505; --amb1: rgb(255 255 255 / .09); --amb2: rgb(255 255 255 / .06); --amb3: rgb(255 255 255 / .05);
  --shadow: 0 14px 34px -14px rgb(0 0 0 / .8); }
html:root.force-light { --bg: #F3F3F3; --surface: #FFFFFF; --surface-2: rgb(20 0 0 / .055); --line: rgb(20 0 0 / .09);
  --glass: rgb(255 255 255 / .58); --glass-hi: rgb(255 255 255 / .82); --glass-2: rgb(255 255 255 / .74); --glass-line: rgb(255 255 255 / .95); --glass-edge: rgb(255 255 255 / .9);
  --seg-on: #FFFFFF; --bar: #F3F3F3; --amb1: rgb(0 0 0 / .07); --amb2: rgb(0 0 0 / .05); --amb3: rgb(0 0 0 / .04);
  --shadow: 0 10px 30px -12px rgb(60 0 0 / .18), 0 1px 2px rgb(0 0 0 / .05); }

html:root[data-tint="on"] { --amb1: color-mix(in srgb, var(--accent) 40%, transparent); --amb2: color-mix(in srgb, var(--accent) 30%, transparent); --amb3: color-mix(in srgb, var(--accent) 16%, transparent); }
body::before { content: ""; position: fixed; inset: -25%; z-index: -1; background: var(--ambient); filter: blur(30px); animation: drift 26s ease-in-out infinite alternate; pointer-events: none; }
@keyframes drift { 0% { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(4%, 3%, 0) scale(1.08); } 100% { transform: translate3d(-3%, 5%, 0) scale(1.03); } }
html { background: var(--bar); }
body { background: transparent; }
#app { position: fixed; inset: 0; }
/* iOS 26 Home Screen apps get a viewport short by the status bar's height (WebKit 301108).
   Making the page that much taller lets the app reach the bottom edge again. */
@media (display-mode: standalone) {
  html { height: min(100lvh, calc(100% + env(safe-area-inset-top))); min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); }
  body { position: relative; height: 100%; }
  #app { position: absolute; top: 0; left: 0; right: 0; bottom: auto; height: 100%; }
}
.seg button { text-align: center; justify-content: center; }
.topbar { background: transparent; }
#view { padding-bottom: 28px; scroll-behavior: smooth; }

.card, .tile { background: linear-gradient(180deg, var(--glass-hi), var(--glass)); border: 1px solid var(--glass-line); border-radius: 20px; box-shadow: var(--shadow), inset 0 1px 0 var(--glass-edge); transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.tile { border-radius: 18px; }
button.card:active, .pick-item:active, .exrow:active { transform: scale(.985); }
.rec { background: var(--surface-2); border-radius: 14px; }
.banner { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 18%, transparent), color-mix(in srgb, var(--accent) 8%, transparent)); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: 16px; }
.resume { border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: var(--shadow), 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent), 0 10px 30px -12px var(--glow); }

.btn { transition: transform .18s var(--ease), box-shadow .25s var(--ease), filter .2s, background .2s; }
.btn:active:not(:disabled), .chip:active, .icon-btn:active, .tab:active, .setno:active, .check:active, .sw:active { transform: scale(.95); }
.btn.primary, .chip.on, .opt-grid .opt.sel, .switch[aria-checked="true"], .minibar { background: var(--accent-grad); color: var(--accent-ink); }
.btn.primary { box-shadow: 0 8px 22px -8px var(--glow), inset 0 1px 0 rgb(255 255 255 / .28); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.soft { background: color-mix(in srgb, var(--accent) 13%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent); }
.btn.ghost { background: var(--surface-2); border: 1px solid var(--line); }

.minibar { width: calc(100% - 20px); }

/* Docked tab bar with a sliding highlight */

.dlg, .sheet-body { overflow-x: hidden; }

const sheetStack = [];

function openSheet(id, { title = '', label = '', titleCls = '', left = '', right = '', body = '', foot = '', ctx = '', onClose } = {}) {

  else { const b = $('.sheet-body', el); keepScroll = b ? b.scrollTop : 0; }
  const i = sheetStack.indexOf(id); if (i >= 0) sheetStack.splice(i, 1); sheetStack.push(id);
  sheetStack.forEach((sid, n) => { const s = sheetEl(sid); if (s) s.style.zIndex = 30 + n * 2; });
  el.setAttribute('aria-label', label || title.replace(/<[^>]+>/g, '') || id);
  el._onClose = onClose;
  el.innerHTML = `<header class="sheet-head"><div class="sheet-head-in"><div class="sh-left">${left}</div><div class="sh-title ${titleCls}">${title}</div><div class="sh-right">${right}</div></div></header><div class="sheet-body" ${ctx ? `data-ctx="${ctx}"` : ''}><div class="inner">${body}</div></div><div class="sheet-foot">${foot}</div>`;
  if (fresh) { $$('.inner > *', el).forEach((c, n) => c.style.setProperty('--i', n)); el.classList.add('entering'); setTimeout(() => el.classList.remove('entering'), 1000); el.getBoundingClientRect(); requestAnimationFrame(() => el.classList.add('open')); }
  else { el.classList.add('open'); if (keepScroll) $('.sheet-body', el).scrollTop = keepScroll; }
  return el;
}
function closeSheet(id) {

  const i = sheetStack.indexOf(id); if (i >= 0) sheetStack.splice(i, 1);

const closeBtn = (id, label = 'Close') => `<button class="btn ghost sm" data-act="sheet-close" data-sheet="${id}">${label}</button>`;

// ---------- next-weight suggestions ----------
function incFor(exId) {
  const ex = getEx(exId); const lb = U() === 'lb';

  return lb ? (big ? 10 : 5) * KG_PER_LB : (big ? 5 : 2.5);
}
function suggestFor(e, prevSets) {
  if (S.settings.progression === false) return null;
  const type = typeOf(e.exId); if (type !== 'wr' && type !== 'wbw') return null;
  const ws = (prevSets || []).filter(s => s.type !== 'w' && s.type !== 'd' && s.w > 0 && s.r > 0); if (!ws.length) return null;
  const topW = Math.max(...ws.map(s => s.w)); const top = ws.filter(s => Math.abs(s.w - topW) < 0.05);

}

const RING_KEYS = [['cal', 'Calories', 1], ['p', 'Protein', .78], ['c', 'Carbs', .58], ['f', 'Fat', .4]];
function ringsSVG(tot, G, size = 132) {

  RING_KEYS.forEach(([k, , op], i) => {

    if (pct > 0.005) h += `<circle class="ring" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--m-${k})" stroke-opacity="${op}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(2)}" style="--c:${C.toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;

  });

  if (spec.goal) g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(spec.goal)}" y2="${Y(spec.goal)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".6" pointer-events="none"/>` + svgText(W - P.r, Y(spec.goal) - 5, 'Goal', 'end', 'style="fill:var(--ink);font-weight:600" pointer-events="none"');

  };

function fixInsets() {
